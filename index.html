<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <meta name="theme-color" content="#140e0a" />
    <meta
      name="description"
      content="Iron Shell — drive a 3D tank through a desert outpost and blast invading aliens."
    />
    <link rel="icon" type="image/svg+xml" href="icons/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <title>Iron Shell — 3D Tank Drive</title>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div class="shell">
      <header class="hud" aria-label="Game status">
        <div class="brand">
          <p class="brand-name">Iron Shell</p>
          <p class="brand-tag">3D desert drive</p>
        </div>
        <div class="meters" aria-live="polite">
          <div class="meter">
            <span class="meter-label">Score</span>
            <span class="meter-value" id="scoreValue">0</span>
          </div>
          <div class="meter">
            <span class="meter-label">Wave</span>
            <span class="meter-value" id="waveValue">1</span>
          </div>
          <div class="meter">
            <span class="meter-label">Hull</span>
            <span class="meter-value hull" id="hullValue" aria-label="Hull integrity">
              <span class="pip"></span><span class="pip"></span><span class="pip"></span>
            </span>
          </div>
        </div>
      </header>

      <main class="stage-wrap">
        <canvas id="game" aria-label="Iron Shell 3D game canvas"></canvas>

        <div class="overlay" id="overlay" data-screen="title">
          <div class="panel">
            <p class="panel-kicker" id="panelKicker">Desert breach</p>
            <h1 class="panel-title" id="panelTitle">Iron Shell</h1>
            <p class="panel-copy" id="panelCopy">
              Drive the hull through the ruined outpost. Steer into the swarm and blast aliens before they reach you.
            </p>
            <button type="button" class="cta" id="primaryBtn">Deploy tank</button>
            <p class="panel-hint" id="panelHint">
              W/S drive · A/D steer · mouse aim · click or Space fire
            </p>
          </div>
        </div>
      </main>

      <div class="touch-pad" id="touchPad" aria-hidden="true">
        <div class="touch-cluster left">
          <button type="button" class="pad-btn" data-key="arrowleft" aria-label="Steer left">◀</button>
          <button type="button" class="pad-btn" data-key="arrowup" aria-label="Drive forward">▲</button>
          <button type="button" class="pad-btn" data-key="arrowdown" aria-label="Drive reverse">▼</button>
          <button type="button" class="pad-btn" data-key="arrowright" aria-label="Steer right">▶</button>
        </div>
        <button type="button" class="pad-btn fire" id="fireBtn" aria-label="Fire">Fire</button>
      </div>
    </div>

    <script type="module" src="js/game.js"></script>
  </body>
</html>
