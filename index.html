<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BeatLink" />
    <meta name="theme-color" content="#0b1f2a" />
    <meta
      name="description"
      content="Find the nearest police officer and see unit locations on a live map."
    />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="icons/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="css/styles.css" />
    <title>BeatLink — Nearest Officer</title>
  </head>
  <body>
    <div class="app">
      <header class="top-bar" aria-label="BeatLink">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <div class="brand-text">
            <p class="brand-name">BeatLink</p>
            <p class="brand-tag">Nearest officer map</p>
          </div>
        </div>
        <button type="button" class="icon-btn" id="refreshBtn" aria-label="Refresh locations">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path
              fill="currentColor"
              d="M17.65 6.35A7.95 7.95 0 0 0 12 4V1L7 6l5 5V7a5 5 0 1 1-4.9 6.08l-1.42.7A6.99 6.99 0 0 0 19 12c0-1.93-.78-3.68-2.05-4.95z"
            />
          </svg>
        </button>
      </header>

      <main class="map-shell" id="map" role="application" aria-label="Officer map"></main>

      <aside class="sheet" id="sheet" aria-live="polite">
        <div class="sheet-handle" aria-hidden="true"></div>
        <div class="status-row" id="statusRow">
          <span class="status-dot" id="statusDot"></span>
          <p id="statusText">Requesting your location…</p>
        </div>

        <section class="nearest" id="nearestCard" hidden>
          <p class="nearest-label">Nearest officer</p>
          <h1 class="nearest-name" id="nearestName">—</h1>
          <p class="nearest-meta" id="nearestMeta">—</p>
          <div class="nearest-actions">
            <button type="button" class="btn btn-primary" id="focusNearestBtn">
              Show on map
            </button>
            <a class="btn btn-ghost" id="callBtn" href="tel:911">Call 911</a>
          </div>
        </section>

        <section class="roster" id="rosterSection" hidden>
          <div class="roster-head">
            <h2>Units nearby</h2>
            <span id="rosterCount">0</span>
          </div>
          <ul class="roster-list" id="rosterList"></ul>
        </section>

        <div class="permission" id="permissionPanel" hidden>
          <p>
            BeatLink needs location access to place you on the map and find the nearest
            officer. On iPhone, allow location when prompted, or use a demo position.
          </p>
          <div class="nearest-actions">
            <button type="button" class="btn btn-primary" id="locateBtn">
              Enable location
            </button>
            <button type="button" class="btn btn-ghost" id="demoBtn">
              Use demo location
            </button>
          </div>
        </div>
      </aside>
    </div>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="js/officers.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
