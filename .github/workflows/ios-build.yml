name: iOS Build

on:
  workflow_dispatch:
  push:
    branches: [main, 'cursor/**']
    paths:
      - 'TexasTechFootball/**'
      - '.github/workflows/ios-build.yml'

jobs:
  build:
    runs-on: macos-14
    defaults:
      run:
        working-directory: TexasTechFootball

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Build for Simulator
        run: |
          xcodebuild \
            -project TexasTechFootball.xcodeproj \
            -scheme TexasTechFootball \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            -configuration Debug \
            build \
            CODE_SIGNING_ALLOWED=NO

      - name: Build Summary
        if: always()
        run: |
          echo "## Build Result" >> $GITHUB_STEP_SUMMARY
          echo "Simulator build completed. To install on a real iPhone, use TestFlight." >> $GITHUB_STEP_SUMMARY
          echo "See INSTALL_ON_IPHONE.md for full instructions." >> $GITHUB_STEP_SUMMARY

  testflight:
    runs-on: macos-14
    if: github.event_name == 'workflow_dispatch'
    needs: build
    defaults:
      run:
        working-directory: TexasTechFootball

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Install Apple Certificate
        if: env.APPSTORE_PRIVATE_KEY != ''
        env:
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: |
          echo "TestFlight upload requires APPSTORE_ISSUER_ID, APPSTORE_KEY_ID,"
          echo "APPSTORE_PRIVATE_KEY, and DEVELOPMENT_TEAM secrets."
          echo "Configure these in GitHub → Settings → Secrets → Actions"
          echo "Then re-run this workflow manually."

      - name: TestFlight Instructions
        run: |
          echo "## TestFlight Upload" >> $GITHUB_STEP_SUMMARY
          echo "Add Apple Developer secrets to enable automatic TestFlight upload." >> $GITHUB_STEP_SUMMARY
          echo "See INSTALL_ON_IPHONE.md for manual upload steps." >> $GITHUB_STEP_SUMMARY
